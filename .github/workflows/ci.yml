name: Plugin checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, iconv, openssl
          coverage: none
      - name: PHP syntax and regression checks
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/security.php
          php tests/bootstrap.php
      - name: JavaScript syntax and release package
        run: |
          node --check assets/blocks.js
          python3 tools/security_scan.py
          python3 tools/build.py
  wordpress-directory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build runtime-only package
        run: |
          python3 tools/build.py
          mkdir -p dist/unpacked
          unzip -q dist/payment-gateway-for-jazzcash-*.zip -d dist/unpacked
      - uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e
        with:
          build-dir: './dist/unpacked/payment-gateway-for-jazzcash'
          slug: 'payment-gateway-for-jazzcash'
          ignore-warnings: false
          ignore-errors: false
